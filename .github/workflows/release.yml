name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify version/tag alignment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$TAG" = "$VERSION"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Generate checksums
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Web Audit Pro $GITHUB_REF_NAME"
