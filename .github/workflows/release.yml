name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Verify, publish to PyPI and create the GitHub release
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing: PyPI trusts this workflow and environment, so no API
    # token is stored in the repository. Configure the publisher once on pypi.org.
    environment:
      name: pypi
      url: https://pypi.org/p/web-audit-pro
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify version/tag alignment
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$TAG" = "$VERSION"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Dependency check
        run: python -m pip check

      - name: Compile check
        run: python -m compileall -q web_audit tests

      - name: Tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/web-audit --help > /dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate checksums
        run: |
          sha256sum dist/* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Web Audit Pro $GITHUB_REF_NAME"
