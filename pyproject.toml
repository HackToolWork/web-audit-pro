[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "web-audit-pro"
version = "5.2.0"
description = "Free, low-impact website security checks with plain-language reports in English and Russian: TLS, email (SPF/DMARC), security headers and WordPress plugins."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Web Audit Pro contributors" }]
keywords = [
  "security",
  "website",
  "scanner",
  "ssl",
  "tls",
  "dmarc",
  "spf",
  "wordpress",
  "security-headers",
  "audit",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
dependencies = [
  "requests==2.34.2",
  "dnspython==2.8.0",
  "rich==15.0.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.urls]
Homepage = "https://sitozor.ru"
Documentation = "https://github.com/HackToolWork/web-audit-pro#readme"
Source = "https://github.com/HackToolWork/web-audit-pro"
Issues = "https://github.com/HackToolWork/web-audit-pro/issues"
Changelog = "https://github.com/HackToolWork/web-audit-pro/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "build==1.6.0",
  "ruff==0.16.6",
  "httpx==0.28.1",
  "httpx2==2.12.0",
]

[project.scripts]
web-audit = "web_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["web_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
